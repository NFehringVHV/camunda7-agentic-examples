# SPDX-License-Identifier: Apache-2.0
spring:
  application:
    name: example-process
  datasource:
    url: jdbc:h2:mem:agentic-demo;DB_CLOSE_DELAY=-1
    username: sa
    password: sa

server:
  port: 8080

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
      first-name: Demo
    filter:
      create: All tasks
    # BPMN files under the classpath are auto-deployed (default pattern classpath*:**/*.bpmn).

logging:
  level:
    io.github.camunda7agentic: INFO
